<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 220" width="340" height="220" role="img" aria-labelledby="t">
  <title id="t">White 2.4 GHz remote (PCB AW2101048): two orange arrow pads (A/B and C/D), two square buttons, a slider</title>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfbfb"/>
      <stop offset="1" stop-color="#e2e4e6"/>
    </linearGradient>
    <g id="pad">
      <circle r="58" fill="#f1f2f3" stroke="#d3d6d9" stroke-width="2"/>
      <circle r="50" fill="none" stroke="#e1e3e5" stroke-width="2"/>
      <rect x="-15" y="-46" width="30" height="30" rx="12" fill="#f47a3c" stroke="#d2541a" stroke-width="1.5"/>
      <rect x="-15" y="16" width="30" height="30" rx="12" fill="#f47a3c" stroke="#d2541a" stroke-width="1.5"/>
      <rect x="-46" y="-15" width="30" height="30" rx="12" fill="#f47a3c" stroke="#d2541a" stroke-width="1.5"/>
      <rect x="16" y="-15" width="30" height="30" rx="12" fill="#f47a3c" stroke="#d2541a" stroke-width="1.5"/>
      <g fill="none" stroke="#c4501a" stroke-width="2" stroke-linejoin="round">
        <path d="M0 -40 l-8 14 h16 z"/><path d="M0 40 l-8 -14 h16 z"/>
        <path d="M-40 0 l14 -8 v16 z"/><path d="M40 0 l-14 -8 v16 z"/>
      </g>
    </g>
  </defs>
  <!-- Body with studs on the sides -->
  <rect x="14" y="30" width="312" height="160" rx="34" fill="url(#body)" stroke="#c8cbcf" stroke-width="2"/>
  <g fill="#f4f5f6" stroke="#cdd0d4" stroke-width="2">
    <circle cx="44" cy="44" r="10"/><circle cx="72" cy="44" r="10"/><circle cx="44" cy="176" r="10"/><circle cx="72" cy="176" r="10"/>
    <circle cx="268" cy="44" r="10"/><circle cx="296" cy="44" r="10"/><circle cx="268" cy="176" r="10"/><circle cx="296" cy="176" r="10"/>
  </g>
  <use href="#pad" x="88" y="110"/>
  <use href="#pad" x="252" y="110"/>
  <!-- Output letters -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#6b4a38" text-anchor="middle">
    <text x="88" y="210">A ▲▼   B ◀▶</text><text x="252" y="210">C ▲▼   D ◀▶</text>
  </g>
  <!-- Square buttons and slider -->
  <rect x="152" y="66" width="36" height="28" rx="5" fill="#f47a3c" stroke="#d2541a" stroke-width="1.5"/>
  <rect x="152" y="126" width="36" height="28" rx="5" fill="#f47a3c" stroke="#d2541a" stroke-width="1.5"/>
  <rect x="146" y="100" width="48" height="20" rx="6" fill="#eceef0" stroke="#cdd0d4" stroke-width="1.5"/>
  <rect x="162" y="98" width="16" height="24" rx="5" fill="#f26d2c" stroke="#d2541a" stroke-width="1.5"/>
  <!-- Blue LED -->
  <circle cx="170" cy="182" r="4" fill="#4a7dff"/>
</svg>
