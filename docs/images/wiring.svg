<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" height="420" role="img" aria-labelledby="t">
  <title id="t">Wiring: ESP32 DevKit to the nRF24 5 V adapter board, with the nRF24L01+ PA+LNA module plugged on the adapter</title>
  <style>
    .lbl { font-family: "Segoe UI", Arial, sans-serif; font-size: 13px; fill: #2b2f33; }
    .pin { font-family: "Segoe UI", Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #ffffff; }
    .title { font-family: "Segoe UI", Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #2b2f33; }
    .note { font-family: "Segoe UI", Arial, sans-serif; font-size: 12px; fill: #5d6670; }
    .wire { fill: none; stroke-width: 5; stroke-linecap: round; }
  </style>
  <rect x="0" y="0" width="820" height="420" rx="16" fill="#ffffff"/>

  <!-- ===== ESP32 DevKit ===== -->
  <text class="title" x="135" y="34" text-anchor="middle">ESP32 DevKit (38 pins)</text>
  <rect x="40" y="48" width="190" height="320" rx="10" fill="#1f2a44" stroke="#111827" stroke-width="2"/>
  <!-- ESP32-WROOM-32U module (metal shield) with its u.FL connector -->
  <rect x="68" y="66" width="134" height="92" rx="4" fill="#c9ced4" stroke="#8b929a" stroke-width="2"/>
  <text class="note" x="135" y="108" text-anchor="middle" fill="#3d434a">ESP32-WROOM</text>
  <text class="note" x="135" y="124" text-anchor="middle" fill="#3d434a">-32U</text>
  <circle cx="186" cy="80" r="6" fill="#d9b24a" stroke="#8a6d1f" stroke-width="2"/>
  <!-- Wi-Fi antenna (u.FL cable) -->
  <path d="M186 80 C 214 66, 232 40, 262 34" fill="none" stroke="#3a3d41" stroke-width="3"/>
  <rect x="262" y="22" width="16" height="74" rx="6" fill="#2b2e32" transform="rotate(20 270 59)"/>
  <text class="note" x="296" y="56">Wi-Fi / Bluetooth</text>
  <text class="note" x="296" y="71">antenna (u.FL)</text>
  <!-- Pin headers on both sides -->
  <g fill="#d6b45a">
    <rect x="46" y="176" width="10" height="176" rx="2"/>
    <rect x="214" y="176" width="10" height="176" rx="2"/>
  </g>
  <!-- USB-C -->
  <rect x="113" y="352" width="44" height="22" rx="8" fill="#a7adb4" stroke="#6b7178" stroke-width="2"/>
  <text class="note" x="135" y="396" text-anchor="middle">USB-C → PC (power + code)</text>
  <!-- Buttons -->
  <rect x="70" y="350" width="18" height="12" rx="3" fill="#e6e8eb"/><text class="pin" x="94" y="360" font-size="10">EN</text>
  <rect x="166" y="350" width="18" height="12" rx="3" fill="#e6e8eb"/><text class="pin" x="190" y="360" font-size="10">BOOT</text>

  <!-- ESP32 pins used (right side) -->
  <g>
    <circle cx="219" cy="186" r="6" fill="#f2c94c"/><text class="pin" x="206" y="190" text-anchor="end">5V</text>
    <circle cx="219" cy="210" r="6" fill="#f2c94c"/><text class="pin" x="206" y="214" text-anchor="end">GND</text>
    <circle cx="219" cy="234" r="6" fill="#f2c94c"/><text class="pin" x="206" y="238" text-anchor="end">GPIO 4</text>
    <circle cx="219" cy="258" r="6" fill="#f2c94c"/><text class="pin" x="206" y="262" text-anchor="end">GPIO 5</text>
    <circle cx="219" cy="282" r="6" fill="#f2c94c"/><text class="pin" x="206" y="286" text-anchor="end">GPIO 18</text>
    <circle cx="219" cy="306" r="6" fill="#f2c94c"/><text class="pin" x="206" y="310" text-anchor="end">GPIO 23</text>
    <circle cx="219" cy="330" r="6" fill="#f2c94c"/><text class="pin" x="206" y="334" text-anchor="end">GPIO 19</text>
  </g>

  <!-- ===== Wires ===== -->
  <path class="wire" stroke="#e53935" d="M219 186 C 330 186, 380 196, 470 196"/>
  <path class="wire" stroke="#212121" d="M219 210 C 330 210, 380 218, 470 218"/>
  <path class="wire" stroke="#fb8c00" d="M219 234 C 330 234, 380 240, 470 240"/>
  <path class="wire" stroke="#fdd835" d="M219 258 C 330 258, 380 262, 470 262"/>
  <path class="wire" stroke="#43a047" d="M219 282 C 330 282, 380 284, 470 284"/>
  <path class="wire" stroke="#1e88e5" d="M219 306 C 330 306, 380 306, 470 306"/>
  <path class="wire" stroke="#8e24aa" d="M219 330 C 330 330, 380 328, 470 328"/>

  <!-- Wire legend -->
  <g class="lbl">
    <text x="300" y="380">red 5V · black GND · orange CE · yellow CSN</text>
    <text x="300" y="398">green SCK · blue MOSI · purple MISO · IRQ not connected</text>
  </g>

  <!-- ===== 5 V adapter board ===== -->
  <text class="title" x="520" y="150" text-anchor="middle">5 V adapter board</text>
  <rect x="460" y="164" width="120" height="196" rx="8" fill="#1565c0" stroke="#0d3c7a" stroke-width="2"/>
  <!-- AMS1117 regulator -->
  <rect x="524" y="296" width="46" height="26" rx="2" fill="#2b2e32"/>
  <text class="pin" x="547" y="313" text-anchor="middle" font-size="9">AMS1117</text>
  <!-- Adapter pins -->
  <g>
    <circle cx="470" cy="196" r="6" fill="#f2c94c"/><text class="pin" x="482" y="200">VCC</text>
    <circle cx="470" cy="218" r="6" fill="#f2c94c"/><text class="pin" x="482" y="222">GND</text>
    <circle cx="470" cy="240" r="6" fill="#f2c94c"/><text class="pin" x="482" y="244">CE</text>
    <circle cx="470" cy="262" r="6" fill="#f2c94c"/><text class="pin" x="482" y="266">CSN</text>
    <circle cx="470" cy="284" r="6" fill="#f2c94c"/><text class="pin" x="482" y="288">SCK</text>
    <circle cx="470" cy="306" r="6" fill="#f2c94c"/><text class="pin" x="482" y="310">MO</text>
    <circle cx="470" cy="328" r="6" fill="#f2c94c"/><text class="pin" x="482" y="332">MI</text>
    <circle cx="470" cy="350" r="5" fill="#9aa0a6"/><text class="pin" x="482" y="354" opacity="0.7">IRQ</text>
  </g>

  <!-- ===== nRF24L01+ PA+LNA module, plugged on the adapter ===== -->
  <text class="title" x="680" y="150" text-anchor="middle">nRF24L01+ PA+LNA</text>
  <rect x="548" y="176" width="220" height="80" rx="6" fill="#26292d" stroke="#111" stroke-width="2"/>
  <rect x="566" y="190" width="70" height="52" rx="3" fill="#b8bec5" stroke="#7d848c" stroke-width="2"/>
  <text class="note" x="601" y="221" text-anchor="middle" fill="#3d434a">PA+LNA</text>
  <rect x="650" y="200" width="40" height="32" rx="3" fill="#3a3e44"/>
  <text class="pin" x="670" y="220" text-anchor="middle" font-size="9">nRF24</text>
  <!-- SMA connector and antenna -->
  <rect x="768" y="204" width="20" height="24" rx="3" fill="#d4af37" stroke="#8a6d1f" stroke-width="2"/>
  <rect x="784" y="40" width="18" height="174" rx="8" fill="#2b2e32"/>
  <rect x="780" y="196" width="26" height="22" rx="4" fill="#3a3d41"/>
  <text class="note" x="700" y="62" text-anchor="end">2.4 GHz antenna (SMA)</text>
  <text class="note" x="700" y="77" text-anchor="end">screw it on before powering up</text>
  <path d="M705 68 H 778" stroke="#9aa0a6" stroke-width="1.5" stroke-dasharray="4 3"/>
  <!-- Radio waves -->
  <g fill="none" stroke="#f47a3c" stroke-width="3" stroke-linecap="round">
    <path d="M772 96 q-14 18 0 36"/><path d="M764 86 q-24 28 0 56" opacity="0.6"/>
  </g>
</svg>
