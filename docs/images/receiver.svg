<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 230" width="220" height="230" role="img" aria-labelledby="t">
  <title id="t">2.4 GHz receiver with a 1-4 selector on the front and two outputs (A, B)</title>
  <defs>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9dcdf"/>
      <stop offset="1" stop-color="#b7bbc0"/>
    </linearGradient>
  </defs>
  <!-- Studs -->
  <g fill="#e2e4e7" stroke="#a9aeb3" stroke-width="2">
    <rect x="40" y="14" width="22" height="14" rx="4"/><rect x="70" y="14" width="22" height="14" rx="4"/>
    <rect x="128" y="14" width="22" height="14" rx="4"/><rect x="158" y="14" width="22" height="14" rx="4"/>
  </g>
  <!-- Upper grey brick -->
  <rect x="30" y="26" width="160" height="124" rx="6" fill="url(#side)" stroke="#9fa4aa" stroke-width="2"/>
  <!-- Lower dark grey plate with Technic holes -->
  <rect x="26" y="148" width="168" height="54" rx="6" fill="#7f858c" stroke="#62676d" stroke-width="2"/>
  <circle cx="64" cy="176" r="11" fill="#2b2e32" stroke="#565b61" stroke-width="3"/>
  <circle cx="156" cy="176" r="11" fill="#2b2e32" stroke="#565b61" stroke-width="3"/>
  <!-- Black front with the selector -->
  <rect x="72" y="18" width="76" height="160" rx="36" fill="#23262a"/>
  <rect x="86" y="34" width="48" height="36" rx="6" fill="#3a3e44"/>
  <rect x="98" y="80" width="24" height="84" rx="8" fill="#141618"/>
  <rect x="102" y="104" width="16" height="56" rx="5" fill="#f9a374"/>
  <rect x="96" y="96" width="28" height="22" rx="7" fill="#f26d2c" stroke="#d2541a" stroke-width="1.5"/>
  <path d="M104 107 h12 M104 112 h12" stroke="#ffb48a" stroke-width="2" stroke-linecap="round"/>
  <!-- Selector numbers -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#c9ccd0" text-anchor="middle">
    <text x="138" y="104">1</text><text x="138" y="122">2</text><text x="138" y="140">3</text><text x="138" y="158">4</text>
  </g>
  <!-- Cable -->
  <path d="M30 60 C10 60 6 90 10 120" fill="none" stroke="#2a2c2f" stroke-width="7" stroke-linecap="round"/>
  <text x="110" y="222" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#555b62">outputs A + B</text>
</svg>
